name: Build Sleep Client

on:
  push:
    paths:
      - 'sleep-client/**'
      - '.github/workflows/build-sleep-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build Sleep Client
        working-directory: sleep-client
        run: gradle build --stacktrace
      - name: Upload Sleep Client jar
        uses: actions/upload-artifact@v4
        with:
          name: Sleep-Client-1.21.11
          path: |
            sleep-client/build/libs/*.jar
            !sleep-client/build/libs/*-sources.jar
