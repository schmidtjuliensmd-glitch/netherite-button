name: Build Sleep Client

on:
  push:
    paths:
      - 'sleep-client/**'
      - '.github/workflows/build-sleep-client.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build Sleep Client
        working-directory: sleep-client
        run: gradle build --stacktrace
      - name: Verify chunk detection rules
        working-directory: sleep-client
        run: java -cp build/classes/java/main checks/ChunkFinderChecks.java
      - name: Upload Sleep Client jar
        uses: actions/upload-artifact@v4
        with:
          name: Sleep-Client-1.21.11
          path: |
            sleep-client/build/libs/*.jar
            !sleep-client/build/libs/*-sources.jar

      - name: Publish website download
        run: |
          mkdir -p downloads
          JAR="$(find sleep-client/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" downloads/Sleep-Client-1.21.11.jar
          VERSION="$(grep '^mod_version=' sleep-client/gradle.properties | cut -d= -f2)"
          printf '{"latestVersion":"%s","minecraftVersion":"1.21.11","downloadUrl":"https://julienmcoption.vercel.app/clients.html"}\n' "$VERSION" > downloads/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Sleep-Client-1.21.11.jar downloads/version.json
          if git diff --cached --quiet; then
            echo "Download JAR is already current."
          else
            git commit -m "Publish latest Sleep Client download"
            git push
          fi
